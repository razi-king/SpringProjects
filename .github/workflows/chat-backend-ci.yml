name: Chat backend CI

on:
  push:
    branches: [main]
    paths: ["ChatAppBackend/**", ".github/workflows/chat-backend-ci.yml"]
  pull_request:
    paths: ["ChatAppBackend/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: ChatAppBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        run: mvn -B package
      - name: Build Docker image
        run: docker build -t chat-backend .
