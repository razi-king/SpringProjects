spring.application.name=ChatAppBackend

# Local default; on Render set MONGODB_URI to your MongoDB Atlas connection string
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chatapp}
server.port=${PORT:8080}

# Comma-separated list of frontends allowed to call the API and open the WebSocket
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
